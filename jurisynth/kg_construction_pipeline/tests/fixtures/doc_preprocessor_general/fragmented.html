<body>

<table>
    <thead>
        <tr>
            <th>Item</th>
            <th>Value</th>
        </tr>
    </thead>
    <tbody>
        <tr>

            <td>10</td>
        </tr>
        <tr>

            <td>20</td>
        </tr>
    </tbody>
</table>

<table>
    <tbody>
        <tr>
            <td>Gamma</td>
            <td>30</td>
        </tr>
        <tr>
            <td>Delta</td>
            <td>40</td>
        </tr>
    </tbody>
</table>

</body>
</html>
