<!DOCTYPE html>
<html>
<head>
    <title>Hierarchical Columns Fixture</title>
</head>
<body>

<h1>Hierarchical Column Fixture</h1>

<table>
    <thead>
        <tr>
            <th rowspan="2">Country</th>
            <th colspan="2">Population</th>
        </tr>
        <tr>
            <th>Total</th>
            <th>Urban</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>Alpha</td>
            <td>1000</td>
            <td>700</td>
        </tr>
        <tr>
            <td>Beta</td>
            <td>2000</td>
            <td>1500</td>
        </tr>
    </tbody>
</table>

</body>
</html>
