<!DOCTYPE html>
<html>
<head>
    <title>Header Variants Fixture</title>
</head>
<body>

<h1>Header Variants Fixture</h1>

<h2>Explicit header</h2>

<table>
    <thead>
        <tr>
            <th>Country</th>
            <th>Population</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>Alpha</td>
            <td>100</td>
        </tr>
        <tr>
            <td>Beta</td>
            <td>200</td>
        </tr>
    </tbody>
</table>

<h2>Inferred header</h2>

<table>
    <tr>
        <td>Year</td>
        <td>Amount</td>
    </tr>
    <tr>
        <td>2020</td>
        <td>10</td>
    </tr>
    <tr>
        <td>2021</td>
        <td>20</td>
    </tr>
</table>

<h2>Headerless table</h2>

<table>
    <tr>
        <td>Alpha</td>
        <td>100</td>
    </tr>
    <tr>
        <td>Beta</td>
        <td>200</td>
    </tr>
</table>

</body>
</html>
